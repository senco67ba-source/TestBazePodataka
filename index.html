  .options input { margin-right: 10px; }
  textarea { width: 100%; font-family: 'Consolas', monospace; padding: 10px; border: 1px solid #ccc; border-radius: 5px; min-height: 70px; }
  button { background: #1a5490; color: #fff; border: none; padding: 12px 30px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 5px; transition: background 0.2s; }

  button:disabled { background: #95a5a6; cursor: not-allowed; }
  button.secondary { background: #6c757d; }
  input[type=text] { padding: 10px; border: 1px solid #ccc; border-radius: 5px; width: 100%; font-size: 16px; }
  .result-box { text-align: center; padding: 30px; background: linear-gradient(135deg, #1a5490, #2e8b57); color: #fff; border-radius: 10px; margin: 20px 0; }
  .result-box .score { font-size: 48px; font-weight: bold; margin: 10px 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 15px; }
  th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
  th { background: #1a5490; color: #fff; }
  tr:nth-child(even) { background: #f9f9f9; }
  .admin-btn { position: fixed; bottom: 10px; right: 10px; font-size: 11px; padding: 5px 10px; opacity: 0.4; }
  .admin-btn:hover { opacity: 1; }
  .sql-hint { font-size: 12px; color: #666; font-style: italic; margin-top: 5px; }

    font-size: 22px; font-weight: bold; text-align: center; padding: 15px; margin-bottom: 20px;
    border-radius: 8px; background: #eaf7ee; color: #2e8b57; border: 2px solid #2e8b57; transition: all 0.3s ease;

  .notification.danger { background: #c0392b; }
  .notification.success { background: #2e8b57; }
  @keyframes slideDown { from { top: -100px; opacity: 0; } to { top: 20px; opacity: 1; } }

    {q:"Koja komanda dodaje primarni ključ naknadno?", type:"mcq", lvl:"osnovni", pts:1, opts:["ALTER TABLE ... ADD PRIMARY KEY","SET PRIMARY KEY","MAKE PRIMARY","ADD KEY"], a:0},
    {q:"Koja je svrha UNIQUE ograničenja?", type:"mcq", lvl:"osnovni", pts:1, opts:["Dozvoljava duplikate","Osigurava da su sve vrednosti u koloni jedinstvene","Automatski increment","Briše NULL-ove"], a:1},
    {q:"Šta je CHECK ograničenje?", type:"mcq", lvl:"osnovni", pts:1, opts:["Provera korisnika","Ograničenje koje proverava da vrednost zadovoljava uslov","Backup provera","Provera lozinke"], a:1},
    {q:"Koja komanda menja ime tabele?", type:"mcq", lvl:"osnovni", pts:1, opts:["ALTER TABLE ... RENAME TO","RENAME TABLE","CHANGE TABLE NAME","UPDATE TABLE NAME"], a:0},
    {q:"Koji je rezultat CROSS JOIN-a tabela sa 5 i 4 reda?", type:"mcq", lvl:"osnovni", pts:1, opts:["5 redova","4 reda","9 redova","20 redova"], a:3},
    {q:"Koja je razlika između WHERE i HAVING?", type:"mcq", lvl:"osnovni", pts:1, opts:["Nema razlike","WHERE filtrira redove pre grupisanja, HAVING posle","HAVING je brži","WHERE se koristi samo sa JOIN-om"], a:1},
    {q:"Napišite SQL upit koji vraća sve jedinstvene vrednosti iz kolone 'grad' u tabeli 'zaposleni'.", type:"sql", lvl:"osnovni", pts:1, a:["select distinct grad from zaposleni"]},
    {q:"Koja funkcija vraća dužinu stringa?", type:"mcq", lvl:"srednji", pts:2, opts:["SIZE()","LENGTH()","STRLEN()","LEN() i LENGTH() zavisno od baze"], a:3},
    {q:"Šta je CTE (Common Table Expression)?", type:"mcq", lvl:"srednji", pts:2, opts:["Privremeni imenovani rezultat koji se koristi u upitu","Tip tabele","Vrsta indeksa","Backup procedura"], a:0},
    {q:"Koja ključna reč se koristi za definisanje CTE-a?", type:"mcq", lvl:"srednji", pts:2, opts:["WITH","CTE","TEMP","DEFINE"], a:0},
    {q:"Šta je window funkcija?", type:"mcq", lvl:"srednji", pts:2, opts:["Funkcija koja radi nad prozorom OS-a","Funkcija koja radi nad skupom redova povezanim sa trenutnim redom (OVER)","GUI funkcija","Funkcija za backup"], a:1},
    {q:"Koja ključna reč se koristi za definisanje prozora kod window funkcija?", type:"mcq", lvl:"srednji", pts:2, opts:["WINDOW","OVER","RANGE","PARTITION"], a:1},
    {q:"Napišite SQL upit koji vraća ime zaposlenog i rang po plati unutar odeljenja.", type:"sql", lvl:"srednji", pts:2, a:["select ime, rank() over (partition by odeljenje_id order by plata desc) as rang from zaposleni","select ime, rank() over(partition by odeljenje_id order by plata desc) from zaposleni"]},
    {q:"Šta je plan izvršavanja upita (execution plan)?", type:"mcq", lvl:"napredni", pts:3, opts:["Lista korisnika","Način na koji DBMS izvršava upit - koristi se za optimizaciju","Backup plan","Plan migracije"], a:1},
    {q:"Koja je razlika između clustered i non-clustered indeksa?", type:"mcq", lvl:"napredni", pts:3, opts:["Nema razlike","Clustered određuje fizički redosled redova (samo jedan), non-clustered je odvojen","Non-clustered je brži","Clustered se koristi samo za tekst"], a:1},
    {q:"Šta je particionisanje tabele?", type:"mcq", lvl:"napredni", pts:3, opts:["Brisanje tabele","Fizičko deljenje velike tabele na manje delove radi performansi","Kopiranje tabele","Šifrovanje"], a:1},
    {q:"Napišite SQL upit koji koristi CTE da pronađe zaposlene sa platom većom od proseka njihovog odeljenja.", type:"sql", lvl:"napredni", pts:3, a:["with prosek as (select odeljenje_id, avg(plata) as avg_plata from zaposleni group by odeljenje_id) select z.* from zaposleni z join prosek p on z.odeljenje_id=p.odeljenje_id where z.plata>p.avg_plata","with avg_sal as (select odeljenje_id, avg(plata) as a from zaposleni group by odeljenje_id) select z.* from zaposleni z join avg_sal a on z.odeljenje_id=a.odeljenje_id where z.plata>a.a"]}
  ]
};

/* ============================================================
   POMOĆNE FUNKCIJE
   ============================================================ */
const app = document.getElementById('app');
let currentTest = null;
let candidateName = '';
let startTime = null;
let endTime = null;
let timerInterval;
let warned5 = false;
let warned1 = false;
let testSubmitted = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalizeSQL(s) {
  if (!s) return '';
  return s.toLowerCase().replace(/--.*$/gm, '').replace(/\s+/g, ' ').replace(/['"]/g, "'").replace(/\s*([,()=<>])\s*/g, '$1').replace(/;\s*$/, '').trim();
}

function sqlMatches(userAns, correctList) {
  const u = normalizeSQL(userAns);
  if (!u) return false;
  return correctList.some(c => normalizeSQL(c) === u);
}

function determineLevel(score, maxScore) {
  const pct = (score / maxScore) * 100;
  if (pct >= 67) return 'napredni';
  if (pct >= 34) return 'srednji';
  return 'osnovni';
}

function levelLabel(lvl) {
  return {osnovni:'Osnovni', srednji:'Srednji', napredni:'Napredni'}[lvl];
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function showNotification(message, type, duration = 4000) {
  const notif = document.createElement('div');
  notif.className = `notification ${type}`;
  notif.innerHTML = message;
  document.body.appendChild(notif);
  setTimeout(() => {
    notif.classList.add('fade-out');
    setTimeout(() => notif.remove(), 500);
  }, duration);
}

/* ============================================================
   EKRAN 1: UNOS IMENA
   ============================================================ */
function showStart() {
  testSubmitted = false; warned5 = false; warned1 = false;
  app.innerHTML = `
    <h1>🎓 Test iz baza podataka</h1>
    <p>Dobrodošli na test za procenu znanja iz rada sa bazama podataka i SQL-om.</p>
    <p><strong>Pravila:</strong></p>
    <ul>
      <li>Test sadrži 20 pitanja različitog nivoa težine</li>
      <li>Maksimalan broj bodova: <strong>34</strong></li>
      <li>Nivoi: Osnovni (0-33%), Srednji (34-66%), Napredni (67-100%)</li>
      <li>SQL zadatke pišite bez viška razmaka, velika/mala slova nisu bitna</li>
      <li style="color:#c0392b; font-weight:bold;">⏱ Vreme za test: <strong>30 minuta</strong> — test se automatski predaje kada vreme istekne!</li>
    </ul>
    <h2>Unesite vaše podatke</h2>
    <input type="text" id="nameInput" placeholder="Ime i prezime" />
    <br><br>
    <button onclick="startTest()">Započni test</button>
  `;
}

function startTest() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { alert('Molimo unesite ime i prezime.'); return; }
  candidateName = name;

  const variant = Math.floor(Math.random() * 5) + 1;
  const questions = shuffle(TESTS[variant]).map(q => {
    const cq = {...q};
    if (q.type === 'mcq') {
      const indexed = q.opts.map((o,i) => ({o, i}));
      const shuffled = shuffle(indexed);
      cq.opts = shuffled.map(x => x.o);
      cq.a = shuffled.findIndex(x => x.i === q.a);
    }
    return cq;
  });

  currentTest = { variant, questions, answers: new Array(questions.length).fill(null) };
  startTime = Date.now();
  endTime = startTime + TEST_DURATION * 1000;
  testSubmitted = false; warned5 = false; warned1 = false;
  renderTest();
}

/* ============================================================
   EKRAN 2: TEST
   ============================================================ */
function renderTest() {
  const q = currentTest.questions;
  let html = `
    <h1>Test - ${candidateName}</h1>
    <div class="timer" id="timer">⏱ Preostalo vreme: ${formatTime(TEST_DURATION)}</div>
    <p>Varijanta testa: <strong>${currentTest.variant}</strong> | Pitanja: <strong>${q.length}</strong></p>
    <form id="testForm" onsubmit="submitTest(event)">
  `;
  q.forEach((item, idx) => {
    html += `<div class="question" id="q${idx}">
      <span class="points">${item.pts} ${item.pts===1?'bod':'boda'} | ${levelLabel(item.lvl)}</span>
      <strong>Pitanje ${idx+1}.</strong> ${item.q}
      <div style="margin-top:10px;">`;
    if (item.type === 'mcq') {
      html += `<div class="options">`;
      item.opts.forEach((opt, oi) => {
        html += `<label><input type="radio" name="q${idx}" value="${oi}" onchange="currentTest.answers[${idx}]=${oi}"> ${opt}</label>`;
      });
      html += `</div>`;
    } else if (item.type === 'sql') {
      html += `<textarea name="q${idx}" placeholder="Napišite SQL komandu..." oninput="currentTest.answers[${idx}]=this.value"></textarea>
               <div class="sql-hint">Savet: velika/mala slova nisu bitna, tačka-zarez na kraju nije obavezan.</div>`;
    }
    html += `</div></div>`;
  });
  html += `<button type="submit" id="submitBtn">Predaj test</button></form>`;
  app.innerHTML = html;
  updateTimer();
}

function updateTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const timerEl = document.getElementById('timer');
    if (!timerEl || testSubmitted) { clearInterval(timerInterval); return; }

    const now = Date.now();
    const timeLeft = Math.max(0, Math.floor((endTime - now) / 1000));
    timerEl.textContent = `⏱ Preostalo vreme: ${formatTime(timeLeft)}`;

    if (timeLeft <= WARNING_5_MIN && timeLeft > WARNING_1_MIN && !warned5) {
      warned5 = true; timerEl.classList.add('warning');
      showNotification('⚠️ Pažnja! Preostalo je još 5 minuta do kraja testa!', 'warning', 5000);
    }
    if (timeLeft <= WARNING_1_MIN && timeLeft > 0 && !warned1) {
      warned1 = true; timerEl.classList.remove('warning'); timerEl.classList.add('danger');
      showNotification('🚨 UPOZORENJE! Preostao je još samo 1 minut!', 'danger', 5000);
    }
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      showNotification('⏰ Vreme je isteklo! Test se automatski predaje...', 'danger', 3000);
      setTimeout(() => submitTest(null, true), 1500);
    }
  }, 1000);
}

/* ============================================================
   BODOVANJE I SLANJE NA GOOGLE SHEETS
   ============================================================ */
async function submitTest(e, autoSubmit = false) {
  if (e) e.preventDefault();
  if (testSubmitted) return; 
  testSubmitted = true;
  clearInterval(timerInterval);

  const submitBtn = document.getElementById('submitBtn');
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = "Čuvanje rezultata...";
  }

  const now = Date.now();
  const actualTime = Math.min(TEST_DURATION, Math.floor((now - startTime) / 1000));
  const timeTaken = autoSubmit ? TEST_DURATION : actualTime;

  let totalScore = 0, maxScore = 0;
  const details = currentTest.questions.map((item, idx) => {
    maxScore += item.pts;
    const userAns = currentTest.answers[idx];
    let correct = false, userDisplay = '', correctDisplay = '';

    if (item.type === 'mcq') {
      correct = userAns === item.a;
      userDisplay = userAns !== null ? item.opts[userAns] : '(bez odgovora)';
      correctDisplay = item.opts[item.a];
    } else if (item.type === 'sql') {
      correct = sqlMatches(userAns, item.a);
      userDisplay = userAns || '(bez odgovora)';
      correctDisplay = item.a[0];
    }
    if (correct) totalScore += item.pts;
    return { idx: idx+1, q: item.q, lvl: item.lvl, pts: item.pts, userAns: userDisplay, correctAns: correctDisplay, correct, earned: correct ? item.pts : 0 };
  });

  const level = determineLevel(totalScore, maxScore);
  const pct = Math.round((totalScore / maxScore) * 100);

  const result = {
    name: candidateName, variant: currentTest.variant, score: totalScore, maxScore, pct, level,
    time: timeTaken, autoSubmitted: autoSubmit, date: new Date().toISOString(), details
  };

  // 1. Slanje na Google Sheets
  try {
    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // Sprečava CORS greške u browseru, podaci i dalje stižu
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(result)
    });
  } catch (err) {
    console.error("Greška pri slanju na Google Sheets:", err);
  }

  // 2. Čuvanje lokalno (za admin panel na istom uređaju)
  const all = JSON.parse(localStorage.getItem('db_test_results') || '[]');
  all.push(result);
  localStorage.setItem('db_test_results', JSON.stringify(all));

  // 3. Prikaz rezultata
  showResult(result);
}

function showResult(r) {
  const m = Math.floor(r.time / 60), s = r.time % 60;
  const autoNote = r.autoSubmitted ? '<div style="margin-top:10px; font-size:14px; color:#ffcccc;">⏰ Test je automatski predat jer je vreme isteklo</div>' : '';

  let html = `
    <h1>🎓 Rezultat testa</h1>
    <div class="result-box">
      <div>${r.name}</div>
      <div class="score">${r.score} / ${r.maxScore}</div>
      <div>${r.pct}% tačnih</div>
      <div style="margin-top:15px;"><span class="level-badge level-${r.level}">${levelLabel(r.level).toUpperCase()} NIVO</span></div>
      <div style="margin-top:10px; font-size:14px;">Vreme: ${m}:${s.toString().padStart(2,'0')} | Varijanta: ${r.variant}</div>
      ${autoNote}
    </div>
    <h2>Detaljan pregled</h2>
  `;
  r.details.forEach(d => {
    const cls = d.correct ? 'correct' : 'incorrect';
    const icon = d.correct ? '✅' : '❌';
    html += `<div class="question ${cls}">
      <span class="points">${d.earned}/${d.pts} bodova | ${levelLabel(d.lvl)}</span>
      ${icon} <strong>P${d.idx}.</strong> ${d.q}
      <div style="margin-top:8px;"><strong>Vaš odgovor:</strong> ${escapeHtml(d.userAns)}</div>
      ${!d.correct ? `<div><strong>Tačan odgovor:</strong> ${escapeHtml(d.correctAns)}</div>` : ''}
    </div>`;
  });
  html += `<br><button onclick="showStart()">Novi test</button>`;
  app.innerHTML = html;
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   ADMIN PANEL
   ============================================================ */
function showAdmin() {
  const pass = prompt('Admin lozinka:');
  if (pass !== 'admin123') { alert('Pogrešna lozinka'); return; }
  const all = JSON.parse(localStorage.getItem('db_test_results') || '[]');
  if (all.length === 0) { app.innerHTML = '<h1>Admin panel</h1><p>Nema lokalnih rezultata. (Rezultati se čuvaju u Google Sheets tabeli)</p><button onclick="showStart()">Nazad</button>'; return; }

  let html = `<h1>📊 Admin panel - Lokalni rezultati</h1>
    <p><strong>Napomena:</strong> Svi rezultati se automatski čuvaju u vašoj Google Sheets tabeli. Ovo je samo lokalni pregled.</p>
    <p>Ukupno kandidata na ovom uređaju: <strong>${all.length}</strong></p>
    <table>
      <tr><th>#</th><th>Ime</th><th>Datum</th><th>Varijanta</th><th>Bodovi</th><th>%</th><th>Nivo</th><th>Vreme</th><th>Auto?</th></tr>`;
  all.forEach((r, i) => {
    const d = new Date(r.date).toLocaleString('sr-RS');
    const m = Math.floor(r.time/60), s = r.time%60;
    html += `<tr><td>${i+1}</td><td>${escapeHtml(r.name)}</td><td>${d}</td><td>${r.variant}</td><td>${r.score}/${r.maxScore}</td><td>${r.pct}%</td><td><span class="level-badge level-${r.level}">${levelLabel(r.level)}</span></td><td>${m}:${s.toString().padStart(2,'0')}</td><td>${r.autoSubmitted ? '⏰ DA' : '✅ NE'}</td></tr>`;
  });
  html += `</table><br>
    <button class="secondary" onclick="clearResults()">🗑 Obriši lokalne rezultate</button>
    <button class="secondary" onclick="showStart()">Nazad</button>
    <h2>📋 Kontrolni pregled svih pitanja sa tačnim odgovorima</h2>`;

  for (let v = 1; v <= 5; v++) {
    html += `<h3>Varijanta ${v}</h3>`;
    TESTS[v].forEach((q, i) => {
      let ans = q.type === 'mcq' ? q.opts[q.a] : q.a.join(' <em>(ili)</em> ');
      html += `<div class="question"><span class="points">${q.pts}b | ${levelLabel(q.lvl)}</span><strong>P${i+1}.</strong> ${escapeHtml(q.q)}<br><strong>Tačan odgovor:</strong> ${escapeHtml(ans)}</div>`;
    });
  }
  html += `<br><button onclick="showStart()">Nazad na početak</button>`;
  app.innerHTML = html;
}

function clearResults() {
  if (confirm('Obrisati SVE lokalne rezultate? (Podaci u Google Sheets ostaju sačuvani)')) {
    localStorage.removeItem('db_test_results');
    showAdmin();
  }
}

showStart();
</script>
